<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zähler-App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Meerlies-Counter</h1>
      <p class="subtitle">Wie war es heute?</p>
    </header>

    <main class="counter-grid">
      <!-- Zustand 1 -->
      <section class="counter-card card-state-1">
        <h2 class="card-title">Alles hat geklappt</h2>
        <div class="counter-value" id="count-1">0</div>
        <div class="button-row">
          <button type="button" class="btn btn-decrement" id="btn-dec-1" aria-label="Zustand 1 verringern">-1</button>
          <button type="button" class="btn btn-increment" id="btn-inc-1" aria-label="Zustand 1 erhöhen">+1</button>
        </div>
      </section>

      <!-- Zustand 2 -->
      <section class="counter-card card-state-2">
        <h2 class="card-title">Etwas hat nicht funktioniert</h2>
        <div class="counter-value" id="count-2">0</div>
        <div class="button-row">
          <button type="button" class="btn btn-decrement" id="btn-dec-2" aria-label="Zustand 2 verringern">-1</button>
          <button type="button" class="btn btn-increment" id="btn-inc-2" aria-label="Zustand 2 erhöhen">+1</button>
        </div>
      </section>
    </main>

    <!-- Ausgeglichenheits-Skala -->
    <section class="scale-card hidden" id="scale-card">
      <div class="scale-header">
        <span class="scale-label-good">😄</span>
        <span class="scale-title" id="scale-status">Noch keine Daten</span>
        <span class="scale-label-bad">😡</span>
      </div>

      <div class="scale-bar-container">
        <div class="scale-track">
          <div class="scale-center-line" title="Mitte (50%)"></div>
          <div class="scale-pointer" id="scale-pointer" style="left: 50%;"></div>
        </div>
      </div>

      <div class="scale-footer">
        <span class="scale-stat-good" id="percent-state-1">0%</span>
        <span class="scale-stat-bad" id="percent-state-2">0%</span>
      </div>
    </section>

    <!-- Wer hat Schuld? (Beef-Verteilung auf 4 Personen) -->
    <section class="blame-card" id="blame-card">
      <div class="blame-header">
        <div class="blame-title-group">
          <h2 class="blame-title">Wer ist Schuld? 🥊</h2>
        </div>
        <button type="button" class="btn-edit-names" id="btn-open-edit-names" title="Namen der 4 Personen anpassen">
          ✏️ Namen anpassen
        </button>
      </div>

      <div class="persons-grid" id="persons-grid">
        <!-- Wird dynamisch per JS gerendert -->
      </div>
    </section>

    <footer class="app-footer">
      <div class="footer-left">
        <div class="total-display">
          Gesamt: <strong id="total-count">0</strong>
        </div>
        <div class="sync-indicator" id="sync-indicator" title="Status der Cloud-Synchronisation">
          <span class="sync-dot" id="sync-dot"></span>
          <span id="sync-text">Lokal (Offline)</span>
        </div>
      </div>
      <button type="button" class="btn-reset" id="btn-reset">Zähler zurücksetzen</button>
    </footer>
  </div>

  <!-- Modal: Wer ist schuld? -->
  <div class="modal-overlay hidden" id="modal-blame" role="dialog" aria-modal="true" aria-labelledby="modal-blame-title">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-blame-title">💥 Wer ist Schuld?</h3>
        <button type="button" class="btn-close-modal" id="btn-close-blame" aria-label="Schließen">&times;</button>
      </div>
      <p class="modal-subtitle" id="modal-blame-subtitle">Wähle aus, wer etwas verkackt hat</p>

      <div class="blame-selection-grid" id="blame-selection-grid">
        <!-- 4 Auswahl-Buttons werden dynamisch gerendert -->
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btn-cancel-blame">Abbrechen</button>
      </div>
    </div>
  </div>

  <!-- Modal: 4 Personen benennen -->
  <div class="modal-overlay hidden" id="modal-edit-names" role="dialog" aria-modal="true" aria-labelledby="modal-edit-title">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-edit-title">✏️ Personen benennen</h3>
        <button type="button" class="btn-close-modal" id="btn-close-edit" aria-label="Schließen">&times;</button>
      </div>
      <p class="modal-subtitle">Trage hier die 4 Namen ein:</p>

      <form id="form-edit-names" class="edit-names-form">
        <div class="input-grid">
          <div class="input-field">
            <label for="input-person-0">Person 1</label>
            <input type="text" id="input-person-0" maxlength="25" autocomplete="off" required>
          </div>
          <div class="input-field">
            <label for="input-person-1">Person 2</label>
            <input type="text" id="input-person-1" maxlength="25" autocomplete="off" required>
          </div>
          <div class="input-field">
            <label for="input-person-2">Person 3</label>
            <input type="text" id="input-person-2" maxlength="25" autocomplete="off" required>
          </div>
          <div class="input-field">
            <label for="input-person-3">Person 4</label>
            <input type="text" id="input-person-3" maxlength="25" autocomplete="off" required>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btn-cancel-edit">Abbrechen</button>
          <button type="submit" class="btn btn-primary-submit">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase SDK (Realtime Database Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script src="script.js"></script>
</body>
</html>
